include "application.conf"

ktor {
  environment = development
}

settings {
  auth {
    enabled = false
  }
  api_key = "dev-key"
  api_key = ${?API_KEY}
}

database {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  name = "ktor_tutorial_db"
  name = ${?POSTGRES_DB}
  user = "postgresql"
  user = ${?POSTGRES_USER}
  password = "password"
  password = ${?POSTGRES_PASSWORD}
}
