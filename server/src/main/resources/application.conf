ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [org.enciyo.agentspawn.ApplicationKt.module]
  }
  environment = development
  environment = ${?KTOR_ENV}
}

settings {
  auth {
    enabled = true
  }
  api_key = "default"
  api_key = ${?API_KEY}
}

database {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  name = "ktor_tutorial_db"
  name = ${?POSTGRES_DB}
  user = "postgresql"
  user = ${?POSTGRES_USER}
  password = "password"
  password = ${?POSTGRES_PASSWORD}
}
